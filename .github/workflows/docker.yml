# Builds the Round Remote server image (Dockerfile) for amd64 + arm64 and pushes it to the GitHub
# Container Registry: ghcr.io/<owner>/roundremote — tags: latest (main), sha-<short>, and 1.2.3 / 1.2 / 1 for v* tags.
# Uses the workflow's own GITHUB_TOKEN (no secrets to set up). After the first run make the package public once:
# GitHub → your profile → Packages → roundremote → Package settings → Change visibility → Public
# (or keep it private and `docker login ghcr.io` on the NAS with a personal access token that has read:packages).
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['screenshots/**', '**.md', 'pi/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # image names must be lowercase (the owner is "RoyBorkin")
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/roundremote" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up QEMU (arm64 / arm/v7 on an x86 runner)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # add ,linux/arm/v7 for 32-bit Raspberry Pi OS (slow under QEMU; most NAS are amd64, a Pi 4/5 with 64-bit OS is arm64)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          # Apple TV control needs pyatv inside the image
          build-args: |
            WITH_PYATV=1
