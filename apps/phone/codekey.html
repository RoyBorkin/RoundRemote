<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="robots" content="noindex">
<title>Key card · שם קוד</title>
<style>
  :root { --bg: #0b0b0f; --fg: #f4f4f6; --muted: #a1a1aa; --card: #18181d; --line: #2a2a31; --red: #e5484d; --blue: #3b82f6; --green: #22c55e; --neutral: #d6c7a1; --ink: #0b0b0f; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f5f2; --fg: #18181b; --muted: #57534e; --card: #ffffff; --line: #e4e0d8; --neutral: #e8dcbc; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Rubik, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); gap: 14px; }
  header { width: 100%; max-width: 520px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  h1 small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
  .who { width: 100%; max-width: 520px; padding: 10px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .who b { color: var(--tc, var(--fg)); }
  .frame { width: min(100%, 520px); padding: 12px; border-radius: 22px; background: var(--card); border: 6px solid var(--tc, var(--line)); }
  .grid { display: grid; gap: 7px; }
  .cell { aspect-ratio: 1.45; border-radius: 9px; border: 0; padding: 0; position: relative; background: var(--neutral); box-shadow: inset 0 -3px 0 rgb(0 0 0 / .18); cursor: pointer; transition: opacity .2s, transform .1s; }
  .cell:active { transform: scale(.94); }
  .cell.r { background: var(--red); } .cell.b { background: var(--blue); } .cell.g { background: var(--green); }
  .cell.x { background: #111114; box-shadow: inset 0 0 0 2px #52525b; }
  .cell.x::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; color: #fafafa; font-weight: 900; font-size: 22px; }
  .cell.done { opacity: .22; }
  .cell.done::before { content: ""; position: absolute; left: 12%; right: 12%; top: 50%; height: 3px; background: var(--fg); transform: rotate(-20deg); border-radius: 3px; }
  .pics .cell { aspect-ratio: 1.2; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; font-size: 14px; color: var(--muted); font-weight: 600; max-width: 520px; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; background: var(--c); }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button.pill { border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 999px; cursor: pointer; }
  button.pill:active { transform: scale(.96); }
  .cover { position: fixed; inset: 0; display: none; place-items: center; background: var(--bg); z-index: 5; text-align: center; padding: 24px; }
  .cover.on { display: grid; }
  .cover b { font-size: 22px; display: block; margin-bottom: 6px; }
  .note { font-size: 13px; color: var(--muted); text-align: center; max-width: 520px; }
  .err { margin-top: 30vh; text-align: center; }
</style>
</head>
<body>
<main id="m" style="display:contents"></main>
<div class="cover" id="cover" role="button" tabindex="0"><div><b>Key hidden</b><span dir="auto">Tap to show · הקש כדי להציג</span></div></div>
<script>
// The same generator as apps/bg-codekey.js (keep them identical).
(function () {
  var MODES = { c: 'classic', p: 'pictures', d: 'duet' };
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
  function fill(pairs) { var out = []; pairs.forEach(function (p) { for (var i = 0; i < p[1]; i++) out.push(p[0]); }); return out; }
  function genKey(key) {
    var mode = MODES[key[0]] || 'classic';
    var seed = parseInt(key.slice(1), 36) || 1;
    var rnd = mulberry32(seed);
    if (mode === 'duet') {
      var cells = shuffle(fill([['gg', 3], ['gn', 5], ['gx', 1], ['xg', 1], ['xx', 1], ['xn', 1], ['ng', 5], ['nx', 1], ['nn', 7]]), rnd);
      return { mode: mode, cols: 5, rows: 5, cells: cells.map(function (c) { return [c[0], c[1]]; }) };
    }
    var start = rnd() < 0.5 ? 'r' : 'b', other = start === 'r' ? 'b' : 'r';
    var d = mode === 'pictures' ? [8, 7, 4, 5, 4] : [9, 8, 7, 5, 5];
    return { mode: mode, start: start, cols: d[3], rows: d[4], cells: shuffle(fill([[start, d[0]], [other, d[1]], ['n', d[2]], ['x', 1]]), rnd) };
  }
  window.genKey = genKey;

  var q = new URLSearchParams(location.search);
  var k = (q.get('k') || '').replace(/[^a-z0-9]/gi, '').toLowerCase();
  var side = q.get('s') === 'b' ? 1 : 0;
  var m = document.getElementById('m');
  var cover = document.getElementById('cover');
  if (!k || !MODES[k[0]]) { m.innerHTML = '<div class="err"><h1>No key</h1><p class="note">Scan the QR code on the Codenames page of the Round Remote display.</p></div>'; return; }
  var K = genKey(k);
  var store = 'codekey.' + k + '.' + side;
  var done = {}; try { done = JSON.parse(sessionStorage.getItem(store) || '{}'); } catch (e) {}
  var rot = 0; try { rot = +(localStorage.getItem('codekey.rot') || 0); } catch (e) {}
  var duet = K.mode === 'duet';
  var colors = { r: ['var(--red)', 'Red', 'אדום'], b: ['var(--blue)', 'Blue', 'כחול'] };
  var tc = duet ? 'var(--green)' : colors[K.start][0];
  var title = duet ? 'Duet · side ' + (side ? 'B' : 'A') : K.mode === 'pictures' ? 'Pictures key' : 'Key card';
  var who = duet ? '<span>Your agents: <b>9 green</b></span><span>3 assassins</span>'
    : '<span dir="auto"><b>' + colors[K.start][1] + ' starts · ' + colors[K.start][2] + ' מתחיל</b></span><span>' + (K.mode === 'pictures' ? '8 · 7 · 4 · 1' : '9 · 8 · 7 · 1') + '</span>';
  m.innerHTML = '<header><h1>' + title + '<small dir="auto">שם קוד · spymasters only</small></h1><button class="pill" id="hide">Hide</button></header>'
    + '<div class="who" style="--tc:' + tc + '">' + who + '</div>'
    + '<div class="frame" id="frame" style="--tc:' + tc + '"><div class="grid' + (K.mode === 'pictures' ? ' pics' : '') + '" id="grid" style="grid-template-columns:repeat(' + K.cols + ',1fr)"></div></div>'
    + '<div class="legend">' + (duet ? '<span><i style="--c:var(--green)"></i>Agent</span><span><i style="--c:var(--neutral)"></i>Bystander</span><span><i style="--c:#111114"></i>Assassin</span>'
      : '<span><i style="--c:var(--red)"></i>Red</span><span><i style="--c:var(--blue)"></i>Blue</span><span><i style="--c:var(--neutral)"></i>Bystander</span><span><i style="--c:#111114"></i>Assassin</span>') + '</div>'
    + '<div class="bar"><button class="pill" id="rot">Rotate ⟳</button><button class="pill" id="clr">Clear marks</button></div>'
    + '<p class="note">Turn the phone (or tap Rotate) so the grid matches the cards on the table. Tap a square to mark it as found.</p>'
    + '<p class="note" dir="rtl">סובבו עד שהרשת תתאים לקלפים על השולחן. הקישו על משבצת כדי לסמן שנמצאה.</p>';
  var grid = document.getElementById('grid'), frame = document.getElementById('frame');
  function draw() {
    grid.innerHTML = '';
    var R = K.rows, C = K.cols, odd = rot % 2 === 1, rr = odd ? C : R, cc = odd ? R : C;
    grid.style.gridTemplateColumns = 'repeat(' + cc + ',1fr)';
    for (var y = 0; y < rr; y++) for (var x = 0; x < cc; x++) {
      var oy = rot === 0 ? y : rot === 1 ? R - 1 - x : rot === 2 ? R - 1 - y : x;
      var ox = rot === 0 ? x : rot === 1 ? y : rot === 2 ? C - 1 - x : C - 1 - y;
      (function (i) {
        var c = K.cells[i], v = duet ? c[side] : c;
        var b = document.createElement('button');
        b.className = 'cell ' + v + (done[i] ? ' done' : '');
        b.setAttribute('aria-label', (v === 'x' ? 'Assassin' : v === 'n' ? 'Bystander' : 'Agent') + ' ' + (i + 1));
        b.dataset.v = v; b.dataset.i = i;
        b.onclick = function () { done[i] = !done[i]; try { sessionStorage.setItem(store, JSON.stringify(done)); } catch (e) {} draw(); };
        grid.appendChild(b);
      })(oy * C + ox);
    }
  }
  document.getElementById('rot').onclick = function () { rot = (rot + 1) % 4; try { localStorage.setItem('codekey.rot', rot); } catch (e) {} draw(); };
  document.getElementById('clr').onclick = function () { done = {}; try { sessionStorage.removeItem(store); } catch (e) {} draw(); };
  document.getElementById('hide').onclick = function () { cover.classList.add('on'); };
  cover.onclick = function () { cover.classList.remove('on'); };
  draw();
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
})();
</script>
</body>
</html>
