  <style>
    #rr-splash{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#000;cursor:none;transition:opacity .35s ease}
    #rr-splash svg{width:min(100vw,100vh);height:min(100vw,100vh);display:block;transition:transform .35s ease}
    #rr-splash .rs-disc{fill:#000}#rr-splash .rs-trk,#rr-splash .rs-ring{fill:none;stroke:#fff;stroke-width:4}#rr-splash .rs-trk{stroke-opacity:.16}
    #rr-splash .rs-ring{stroke-dasharray:100 100}#rr-splash .rs-logo path{fill:#fff;stroke:#fff;stroke-width:0}
    .rs-off #rr-splash{display:none}
    .rs-play #rr-splash .rs-logo path{fill-opacity:0;stroke-width:6;stroke-dasharray:1 1;stroke-dashoffset:1;animation:rs-draw .65s cubic-bezier(.6,0,.3,1) .05s forwards,rs-fill .45s ease .45s forwards}
    .rs-play #rr-splash .rs-ring{stroke-dashoffset:100;animation:rs-sweep .95s cubic-bezier(.65,0,.35,1) .1s forwards}
    .rs-play #rr-splash .rs-trk{opacity:0;animation:rs-in .3s ease forwards}
    .rs-lite #rr-splash svg{opacity:0;animation:rs-in .3s ease forwards}
    .rs-light #rr-splash .rs-disc{fill:#f4f4f6}.rs-light #rr-splash .rs-trk,.rs-light #rr-splash .rs-ring{stroke:#141416}.rs-light #rr-splash .rs-trk{stroke-opacity:.12}.rs-light #rr-splash .rs-logo path{fill:#141416;stroke:#141416}
    #rr-splash.rs-out{opacity:0;pointer-events:none}#rr-splash.rs-out svg{transform:scale(1.04)}.rs-lite #rr-splash.rs-out svg,.rs-quick #rr-splash.rs-out svg{transform:none}.rs-quick #rr-splash{transition-duration:.2s}
    #rr-splash.rs-skip{opacity:0;pointer-events:none;transition-duration:.15s}
    @keyframes rs-draw{to{stroke-dashoffset:0}}@keyframes rs-fill{to{fill-opacity:1;stroke-opacity:0}}@keyframes rs-sweep{to{stroke-dashoffset:0}}@keyframes rs-in{to{opacity:1}}
