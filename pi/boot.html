<!-- Round Remote kiosk boot page: Chromium opens this local file first (pi/kiosk.sh), so the screen shows the logo
     and ring from the boot splash — same place, same size — instead of black or white while the bridge starts. It
     waits for the bridge, then opens the app (URL after the #), whose startup animation carries on from here. -->
<html lang="en" style="background:#000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Round Remote</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, sans-serif; color: #888; }
  svg { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; grid-area: 1 / 1; }
  .trk, .ring { fill: none; stroke: #fff; stroke-width: 4; }
  .trk { stroke-opacity: .16; }
  .logo path { fill: #fff; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .86; } }
  #msg { grid-area: 1 / 1; align-self: end; margin-bottom: 21vmin; max-width: 56vmin; text-align: center; opacity: 0; transition: opacity .6s; }
  #msg.on { opacity: 1; }
</style>
</head>
<body>
<svg viewBox="0 0 720 720" aria-hidden="true"><circle class="trk" cx="360" cy="360" r="295.2"/><circle class="ring" cx="360" cy="360" r="295.2"/><g class="logo" transform="translate(216 216) scale(.372093)"><path d="M341.4 42.1 336.4 44.1 38.1 216.4 34.4 219.9 32.1 223.4 31.1 226.6 31.1 232.6 35.1 241.4 147.1 434.6 151.1 442.6 151.1 449.6 150.1 452.4 145.4 458.1 46.4 515.1 43.4 517.4 41.1 520.4 39.1 524.9 39.1 532.4 40.1 535.4 43.4 539.9 73.6 559.9 77.9 561.9 86.6 561.9 96.4 556.9 226.1 481.9 231.9 476.4 233.9 471.4 233.9 464.6 232.9 461.6 115.1 258.1 113.9 254.9 113.9 248.4 116.9 242.4 122.4 237.9 277.9 148.1 281.1 146.9 287.6 146.9 292.6 149.1 297.1 153.6 299.1 158.1 299.1 698.4 300.1 702.6 302.1 706.4 306.6 710.6 336.4 729.9 341.4 731.9 347.4 731.9 354.1 728.6 357.9 724.6 359.9 720.1 359.9 53.9 357.9 49.4 352.9 44.4 347.4 42.1Z"/><path fill-rule="evenodd" d="M417.4 42.1 411.9 44.4 408.1 47.6 405.1 52.6 404.4 56.6 404.4 716.6 406.4 723.4 410.1 727.9 415.1 730.9 422.4 731.6 427.6 729.9 689.4 578.9 725.6 557.9 730.9 553.1 732.9 549.4 733.9 544.9 732.9 538.6 614.9 334.4 613.9 332.1 613.6 324.9 613.9 322.9 616.1 318.9 621.4 314.1 736.1 248.1 739.9 244.6 741.9 241.4 742.9 238.1 742.9 231.9 740.9 226.9 737.6 223.1 726.4 216.1 428.4 44.1 423.1 42.1ZM477.1 146.9 483.4 146.9 488.6 149.1 614.6 221.9 618.1 224.6 621.1 229.1 622.1 232.1 622.1 238.1 619.9 243.1 617.4 246.1 536.9 292.9 532.4 298.1 530.4 305.6 531.1 310.4 640.9 500.4 650.1 516.6 650.9 519.6 650.1 527.4 647.1 531.9 643.4 535.1 487.9 624.9 482.6 626.9 475.1 626.1 470.4 623.1 465.9 616.6 465.1 612.4 465.1 161.1 465.9 156.9 469.1 151.6 472.1 149.1Z"/></g></svg>
<div id="msg"></div>
<script>
  // the app's address comes after the # (pi/kiosk.sh); a plain open of this file goes to the local bridge
  let app = location.hash.slice(1) || 'http://127.0.0.1:8765/';
  if (/^https?%3A/i.test(app)) app = decodeURIComponent(app);
  const base = app.replace(/[?#].*$/, '');
  const msg = document.getElementById('msg');
  const t0 = Date.now();
  let gone = false;
  const go = () => { if (!gone) { gone = true; location.replace(app.replace(/#.*$/, '') + '#rr-boot'); } };
  async function poll() {
    if (gone) return;
    try {
      // an opaque answer is enough: the bridge is up (no-cors works from a file:// page)
      await fetch(base + 'api/info', { mode: 'no-cors', cache: 'no-store' });
      return go();
    } catch {}
    const s = (Date.now() - t0) / 1000;
    if (s > 20) { msg.textContent = 'Starting Round Remote…'; msg.classList.add('on'); }
    if (s > 60) msg.textContent = 'The bridge isn’t answering yet. Over SSH: journalctl -u roundremote-bridge -e';
    if (s > 180) return go();   // open it anyway (Chromium shows its own error page, the app retries from there)
    setTimeout(poll, 400);
  }
  poll();
</script>
</body>
</html>
