# /etc/wireplumber/wireplumber.conf.d/51-roundremote-no-hdmi.conf (WirePlumber 0.5, Trixie) — installed by
# pi/install.sh when a USB / I2S speaker is present: hide the HDMI audio outputs so sound goes to the speaker.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.platform-.*hdmi.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
